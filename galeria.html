<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería | Amazonía Putumayo Tours</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                Amazonía Putumayo Tours
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">Nosotros</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="servicios.html">Servicios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="galeria.html">Galería</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- HEADER -->

    <header class="bg-success text-white text-center py-5">

        <div class="container">

            <h1 class="display-4">
                Galería de Experiencias
            </h1>

            <p class="lead">
                Descubre algunos de los lugares más impresionantes del Putumayo.
            </p>

        </div>

    </header>

    <!-- CARRUSEL -->

    <section class="container py-5">

        <h2 class="text-center mb-4">
            Destinos Destacados
        </h2>

        <div id="carouselPutumayo"
             class="carousel slide shadow rounded overflow-hidden"
             data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="img/galeria1.jpg"
                         class="d-block w-100"
                         alt="Fin del Mundo">
                </div>

                <div class="carousel-item">
                    <img src="img/galeria2.jpg"
                         class="d-block w-100"
                         alt="Senderismo">
                </div>

                <div class="carousel-item">
                    <img src="img/galeria3.jfif"
                         class="d-block w-100"
                         alt="Cultura">
                </div>

            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselPutumayo"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselPutumayo"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </section>

    <!-- GALERÍA -->

    <section class="container py-5">

        <h2 class="text-center mb-5">
            Lugares Turísticos
        </h2>

        <div class="row g-4 galeria">

            <div class="col-md-4">

                <img src="img/galeria1.jpg"
                     class="img-fluid rounded shadow"

                     data-bs-toggle="modal"
                     data-bs-target="#img1">

            </div>

            <div class="col-md-4">

                <img src="img/galeria2.jpg"
                     class="img-fluid rounded shadow"

                     data-bs-toggle="modal"
                     data-bs-target="#img2">

            </div>

            <div class="col-md-4">

                <img src="img/galeria3.jfif"
                     class="img-fluid rounded shadow"

                     data-bs-toggle="modal"
                     data-bs-target="#img3">

            </div>

        </div>

    </section>

    <!-- MODAL 1 -->

    <div class="modal fade" id="img1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <img src="img/galeria1.jpg"
                     class="img-fluid">

            </div>

        </div>

    </div>

    <!-- MODAL 2 -->

    <div class="modal fade" id="img2">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <img src="img/galeria2.jpg"
                     class="img-fluid">

            </div>

        </div>

    </div>

    <!-- MODAL 3 -->

    <div class="modal fade" id="img3">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <img src="img/galeria3.jpg"
                     class="img-fluid">

            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <footer class="text-center">

        <div class="container">

            <p class="mb-0">
                © 2025 Amazonía Putumayo Tours
            </p>

        </div>

    </footer>

    <script src="js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
